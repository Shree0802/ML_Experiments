<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Card Assignment Prediction</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#eef4ff;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    width:430px;
    background:white;
    padding:35px;
    border-radius:15px;
    box-shadow:0px 8px 20px rgba(0,0,0,.2);
}

h1{
    text-align:center;
    color:#1565c0;
}

h3{
    text-align:center;
    color:#666;
    margin-top:8px;
    margin-bottom:25px;
    font-weight:normal;
}

label{
    display:block;
    font-weight:bold;
    margin-top:15px;
    margin-bottom:8px;
}

input,
select{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
    background:white;
}

input:focus,
select:focus{
    outline:none;
    border-color:#1565c0;
}

button{
    width:100%;
    padding:13px;
    margin-top:25px;
    background:#1565c0;
    color:white;
    border:none;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#0d47a1;
}

.result{
    margin-top:25px;
    padding:18px;
    border-radius:8px;
    text-align:center;
    font-size:21px;
    font-weight:bold;
    background:#e8f5e9;
    color:green;
}

footer{
    margin-top:20px;
    text-align:center;
    color:#777;
    font-size:13px;
}

</style>

</head>

<body>

<div class="container">

<h1>Card Assignment Prediction</h1>

<h3>Binary Classification using Logistic Regression</h3>

<form action="/predict" method="POST">

<!-- Account ID -->

<label for="account_id">
    Enter Account ID
</label>

<input
    type="number"
    id="account_id"
    name="account_id"
    min="1"
    placeholder="Example: 1573"
    required
>


<!-- Account Type -->

<label for="account_type">
    Select Account Type
</label>

<select
    name="account_type"
    id="account_type"
    required
>

    <option value="" disabled selected>
        Select Account Type
    </option>

    <option value="Savings account">
        Savings account
    </option>

    <option value="Salary account">
        Salary account
    </option>

    <option value="NRI account">
        NRI account
    </option>

</select>


<!-- Prediction Button -->

<button type="submit">
    Predict Card
</button>

</form>


{% if prediction_text %}

<div class="result">

    {{ prediction_text }}

</div>

{% endif %}


<footer>

    ACCount Card Assignment Prediction Project

</footer>

</div>

</body>

</html>
